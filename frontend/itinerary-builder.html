<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itinerary Builder - TravelAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/trip-details.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="https://img.icons8.com/fluency/48/null/airplane-take-off.png" type="image/png">
</head>
<body>
    <!-- Theme toggle moved to navbar -->

    <!-- Navigation Bar -->
    <div id="navbar"></div>
    
    <main>
                <a href="dashboard.html"><h1><i class="fas fa-globe-americas"></i> TravelAI</h1></a>
            </div>
            <nav class="nav">
                <ul>
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="explore.html">Explore</a></li>
                    <li><a href="sustainability.html">Sustainability</a></li>
                    <li><a href="chat.html">AI Assistant</a></li>
                </ul>
            </nav>
            <div class="user-actions">
                <div class="user-menu">
                    <button class="user-menu-btn">
                        <img src="https://ui-avatars.com/api/?name=User&background=4CAFAB&color=fff" alt="User" class="user-avatar">
                        <span class="user-name">User</span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="user-dropdown">
                        <a href="profile.html"><i class="fas fa-user"></i> Profile</a>
                        <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
                        <a href="#" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
                    </div>
                </div>
            </div>
            <div class="menu-toggle">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </header>

    <main>
        <section class="itinerary-builder-section">
            <div class="container">
                <div class="itinerary-builder-header">
                    <div class="back-link">
                        <a href="#" id="back-to-itinerary"><i class="fas fa-arrow-left"></i> Back to Itinerary</a>
                    </div>
                    <div class="trip-info" id="trip-info">
                        <!-- Trip info will be loaded here -->
                        <div class="loading-small"></div>
                    </div>
                    <div class="itinerary-builder-actions">
                        <button class="btn btn-secondary" id="add-day-btn">
                            <i class="fas fa-plus"></i> Add Day
                        </button>
                        <button class="btn btn-primary" id="save-itinerary-btn">
                            <i class="fas fa-save"></i> Save Changes
                        </button>
                    </div>
                </div>
                
                <div class="itinerary-builder-content">
                    <div class="itinerary-sidebar">
                        <div class="sidebar-header">
                            <h3>Days</h3>
                        </div>
                        <div class="day-list" id="day-list">
                            <!-- Day list will be loaded here -->
                            <div class="loading"></div>
                        </div>
                        <div class="sidebar-actions">
                            <button class="btn btn-secondary btn-sm" id="reorder-days-btn">
                                <i class="fas fa-sort"></i> Reorder Days
                            </button>
                        </div>
                    </div>
                    
                    <div class="itinerary-main">
                        <div class="day-editor" id="day-editor">
                            <!-- Day editor will be loaded here -->
                            <div class="loading">
                                <div class="spinner"></div>
                                <p>Loading itinerary...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Activity Editor Modal -->
    <div class="modal" id="activity-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="activity-modal-title">Add Activity</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="activity-form">
                    <div class="form-group">
                        <label for="activity-title">Activity Title*</label>
                        <input type="text" id="activity-title" name="title" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="activity-description">Description</label>
                        <textarea id="activity-description" name="description" rows="3"></textarea>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="activity-start-time">Start Time</label>
                            <input type="time" id="activity-start-time" name="startTime">
                        </div>
                        
                        <div class="form-group">
                            <label for="activity-end-time">End Time</label>
                            <input type="time" id="activity-end-time" name="endTime">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="activity-duration">Duration (minutes)</label>
                        <input type="number" id="activity-duration" name="duration" min="1">
                    </div>
                    
                    <div class="form-group">
                        <label for="activity-location">Location</label>
                        <input type="text" id="activity-location" name="location">
                    </div>
                    
                    <div class="form-group">
                        <label for="activity-category">Category</label>
                        <select id="activity-category" name="category">
                            <option value="sightseeing">Sightseeing</option>
                            <option value="food">Food & Dining</option>
                            <option value="adventure">Adventure</option>
                            <option value="relaxation">Relaxation</option>
                            <option value="cultural">Cultural</option>
                            <option value="shopping">Shopping</option>
                            <option value="transport">Transport</option>
                            <option value="accommodation">Accommodation</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="activity-cost">Cost ($)</label>
                            <input type="number" id="activity-cost" name="cost" min="0" step="0.01">
                        </div>
                        
                        <div class="form-group">
                            <label for="activity-sustainability">Sustainability Score (1-10)</label>
                            <input type="number" id="activity-sustainability" name="sustainability" min="1" max="10" step="0.1">
                        </div>
                    </div>
                    
                    <div class="form-group checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="activity-weather-sensitive" name="weatherSensitive">
                            Weather Sensitive Activity
                        </label>
                    </div>
                    
                    <div class="form-group checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="activity-accessibility" name="accessibility">
                            Accessible Activity
                        </label>
                    </div>
                    
                    <div id="activity-error" class="error-message"></div>
                    
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="cancel-activity-btn">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Activity</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Reorder Days Modal -->
    <div class="modal" id="reorder-days-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Reorder Days</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <p>Drag and drop days to reorder them.</p>
                
                <div class="reorder-list" id="reorder-days-list">
                    <!-- Days for reordering will be loaded here -->
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-reorder-btn">Cancel</button>
                    <button type="button" class="btn btn-primary" id="save-reorder-btn">Save Order</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Unsaved Changes Modal -->
    <div class="modal" id="unsaved-changes-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Unsaved Changes</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <p>You have unsaved changes. What would you like to do?</p>
                
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="discard-changes-btn">Discard Changes</button>
                    <button type="button" class="btn btn-primary" id="save-before-exit-btn">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer removed as requested -->
    
    <!-- Toast container for notifications -->
    <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
    
    <!-- Loading indicator -->
    <div id="loading-indicator" class="loading-indicator">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <!-- Main JS -->
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/itinerary-builder.js"></script>
</body>
</html>
