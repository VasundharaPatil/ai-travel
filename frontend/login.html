<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Travel Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="https://img.icons8.com/fluency/48/null/airplane-take-off.png" type="image/png">
</head>
<body>
    <!-- Theme toggle moved to navbar -->

    <div class="floating-elements">
        <div class="floating-icon" style="--delay: 0s; --top: 15%; --left: 10%;"><i class="fas fa-plane"></i></div>
        <div class="floating-icon" style="--delay: 2s; --top: 25%; --left: 85%;"><i class="fas fa-map-marker-alt"></i></div>
        <div class="floating-icon" style="--delay: 1s; --top: 60%; --left: 5%;"><i class="fas fa-compass"></i></div>
        <div class="floating-icon" style="--delay: 3s; --top: 70%; --left: 90%;"><i class="fas fa-camera"></i></div>
        <div class="floating-icon" style="--delay: 2.5s; --top: 40%; --left: 80%;"><i class="fas fa-suitcase"></i></div>
    </div>

    <!-- Navigation Bar -->
    <div id="navbar"></div>

    <main>
        <section class="auth-section">
            <div class="container">
                <div class="auth-container">
                    <div class="auth-card">
                        <div class="auth-header">
                            <h2>Welcome Back</h2>
                            <p>Sign in to continue your journey</p>
                        </div>
                        <form id="login-form" class="auth-form">
                            <div class="form-group">
                                <label for="email"><i class="fas fa-envelope"></i> Email</label>
                                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                            </div>
                            <div class="form-group">
                                <label for="password"><i class="fas fa-lock"></i> Password</label>
                                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                                <div class="password-toggle">
                                    <i class="fas fa-eye"></i>
                                </div>
                            </div>
                            <div class="form-options">
                                <a href="forgot-password.html" class="forgot-password">Forgot Password?</a>
                            </div>
                            <div id="login-error" class="error-message"></div>
                            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
                        </form>

                        <div class="auth-footer">
                            <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer removed as requested -->
    
    <!-- Toast container for notifications -->
    <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
    
    <!-- Loading indicator -->
    <div id="loading-indicator" class="loading-indicator">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Main JS -->
    <script type="module" src="js/main.js"></script>
    <script type="module">
        import { AuthService } from './services/api.js';
        import { login } from './services/auth.js';
        document.addEventListener('DOMContentLoaded', function() {
            // Theme toggle functionality
            const themeSwitch = document.getElementById('theme-switch');
            const body = document.body;
            
            // Check for saved theme preference or use preferred color scheme
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                body.setAttribute('data-theme', savedTheme);
                if (themeSwitch) {
                    themeSwitch.checked = savedTheme === 'dark';
                }
            } else {
                // Check if user prefers dark mode
                const prefersDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (prefersDarkMode) {
                    body.setAttribute('data-theme', 'dark');
                    if (themeSwitch) {
                        themeSwitch.checked = true;
                    }
                }
            }
            
            // Theme switch event listener
            if (themeSwitch) {
                themeSwitch.addEventListener('change', function() {
                    if (this.checked) {
                        body.setAttribute('data-theme', 'dark');
                        localStorage.setItem('theme', 'dark');
                    } else {
                        body.setAttribute('data-theme', 'light');
                        localStorage.setItem('theme', 'light');
                    }
                });
            }

            // Mobile menu toggle
            const menuToggle = document.querySelector('.menu-toggle');
            const nav = document.querySelector('.nav');
            
            if (menuToggle && nav) {
                menuToggle.addEventListener('click', function() {
                    nav.classList.toggle('active');
                });
            }

            // Password visibility toggle
            const passwordToggle = document.querySelector('.password-toggle');
            const passwordInput = document.getElementById('password');
            
            if (passwordToggle && passwordInput) {
                passwordToggle.addEventListener('click', function() {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    const icon = this.querySelector('i');
                    if (icon) {
                        icon.classList.toggle('fa-eye');
                        icon.classList.toggle('fa-eye-slash');
                    }
                });
            }

            // Login form submission
            const loginForm = document.getElementById('login-form');
            const loginError = document.getElementById('login-error');
            
            if (loginForm) {
                loginForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    if (loginError) {
                        loginError.textContent = '';
                    }
                    
                    const emailInput = document.getElementById('email');
                    const passwordInput = document.getElementById('password');
                    
                    if (!emailInput || !passwordInput) {
                        if (loginError) {
                            loginError.textContent = 'Form inputs not found. Please refresh the page and try again.';
                        }
                        return;
                    }
                    
                    const email = emailInput.value;
                    const password = passwordInput.value;
                    
                    try {
                        const response = await AuthService.login({ email, password });
                        // Store the token
                        localStorage.setItem('token', response.token);
                        
                        // Handle case where user object might not be returned
                        if (response.user) {
                            localStorage.setItem('username', response.user.username || 'User');
                            localStorage.setItem('userId', response.user.id || '');
                        } else {
                            // Set default values if user object is not returned
                            localStorage.setItem('username', email.split('@')[0] || 'User');
                            localStorage.setItem('userId', '');
                        }
                        
                        // Redirect to dashboard with a slight delay to ensure storage is complete
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 100);
                    } catch (error) {
                        if (loginError) {
                            loginError.textContent = error.message || 'Login failed. Please check your credentials.';
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
