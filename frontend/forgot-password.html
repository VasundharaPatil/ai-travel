<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forgot Password - AI Travel Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body{
  background:#3a6963;
}
.auth-container{
  max-width:420px;
  margin:80px auto;
}
.card{
  padding:30px;
  border-radius:15px;
}
.hidden{
  display:none;
}
input{
  height:45px;
}
</style>

</head>
<body>

<div class="container">
 <div class="auth-container">

  <div class="card shadow">
    <h3 class="text-center mb-3">Forgot Password</h3>

    <!-- STEP 1 : EMAIL -->
    <form id="emailForm">
      <div class="mb-3">
        <label>Email</label>
        <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
      </div>
      <button class="btn btn-primary w-100">Send OTP</button>
    </form>


    <!-- STEP 2 : OTP -->
    <form id="otpForm" class="hidden">
      <div class="mb-3">
        <label>OTP</label>
        <input type="text" id="otp" class="form-control" placeholder="Enter OTP" required>
      </div>
      <button class="btn btn-primary w-100">Verify OTP</button>
    </form>


    <!-- STEP 3 : RESET PASSWORD -->
    <form id="passwordForm" class="hidden">

      <div class="mb-3">
        <label>New Password</label>
        <input type="password" id="newPassword" class="form-control" required>
      </div>

      <div class="mb-3">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" class="form-control" required>
      </div>

      <button class="btn btn-success w-100">Reset Password</button>

    </form>

    <p id="message" class="mt-3 text-center text-danger"></p>

  </div>
 </div>
</div>


<script>
const emailForm = document.getElementById("emailForm");
const otpForm   = document.getElementById("otpForm");
const passForm  = document.getElementById("passwordForm");
const msg = document.getElementById("message");

// STEP 1
emailForm.addEventListener("submit", e => {
  e.preventDefault();

  alert("OTP Sent to Email ✅  (Demo OTP = 123456)");

  emailForm.classList.add("hidden");
  otpForm.classList.remove("hidden");
});


// STEP 2
otpForm.addEventListener("submit", e => {
  e.preventDefault();

  const otp = document.getElementById("otp").value;

  if(otp !== "123456"){
    msg.textContent = "Invalid OTP ❌";
    return;
  }

  msg.textContent = "";
  otpForm.classList.add("hidden");
  passForm.classList.remove("hidden");
});


// STEP 3
passForm.addEventListener("submit", e => {
  e.preventDefault();

  const p1 = document.getElementById("newPassword").value;
  const p2 = document.getElementById("confirmPassword").value;

  if(p1 !== p2){
    msg.textContent = "Passwords do not match ❌";
    return;
  }

  alert("Password Reset Successfully ✅");

  window.location.href="login.html";
});
</script>

</body>
</html>
