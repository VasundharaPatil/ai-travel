<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - TravelAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="https://img.icons8.com/fluency/48/null/airplane-take-off.png" type="image/png">
</head>
<body>
    <!-- Theme toggle moved to navbar -->

    <div class="floating-elements">
        <div class="floating-icon" style="--delay: 0s; --top: 15%; --left: 10%;"><i class="fas fa-plane"></i></div>
        <div class="floating-icon" style="--delay: 2s; --top: 25%; --left: 85%;"><i class="fas fa-map-marker-alt"></i></div>
        <div class="floating-icon" style="--delay: 1s; --top: 60%; --left: 5%;"><i class="fas fa-compass"></i></div>
        <div class="floating-icon" style="--delay: 3s; --top: 70%; --left: 90%;"><i class="fas fa-camera"></i></div>
        <div class="floating-icon" style="--delay: 2.5s; --top: 40%; --left: 80%;"><i class="fas fa-suitcase"></i></div>
    </div>

    <!-- Navigation Bar -->
    <div id="navbar"></div>

    <main>
        <section class="auth-section">
            <div class="container">
                <div class="auth-container">
                    <div class="auth-card">
                        <div class="auth-header">
                            <h2>Create Your Account</h2>
                            <p>Join TravelAI and start planning your dream trips</p>
                        </div>
                        <form id="signup-form" class="auth-form">
                            <div class="form-group">
                                <label for="username"><i class="fas fa-user"></i> Username</label>
                                <input type="text" id="username" name="username" placeholder="Choose a username" required>
                            </div>
                            <div class="form-group">
                                <label for="email"><i class="fas fa-envelope"></i> Email</label>
                                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                            </div>
                            <div class="form-group">
                                <label for="password"><i class="fas fa-lock"></i> Password</label>
                                <input type="password" id="password" name="password" placeholder="Create a password" required>
                                <div class="password-toggle">
                                    <i class="fas fa-eye"></i>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="confirm-password"><i class="fas fa-lock"></i> Confirm Password</label>
                                <input type="password" id="confirm-password" name="confirmPassword" placeholder="Confirm your password" required>
                            </div>

                            <div id="signup-error" class="error-message"></div>
                            <button type="submit" class="btn btn-primary btn-block">Create Account</button>
                        </form>

                        <div class="auth-footer">
                            <p>Already have an account? <a href="login.html">Sign In</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer removed as requested -->
    
    <!-- Toast container for notifications -->
    <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
    
    <!-- Loading indicator -->
    <div id="loading-indicator" class="loading-indicator">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Main JS -->
    <script type="module" src="js/main.js"></script>
    <script type="module">
        import { AuthService } from './services/api.js';
        import { login } from './services/auth.js';

        document.addEventListener('DOMContentLoaded', function() {
            // Theme toggle functionality
            const themeSwitch = document.getElementById('theme-switch');
            const body = document.body;
            
            // Check for saved theme preference or use preferred color scheme
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                body.setAttribute('data-theme', savedTheme);
                if (themeSwitch) {
                    themeSwitch.checked = savedTheme === 'dark';
                }
            } else {
                // Check if user prefers dark mode
                const prefersDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (prefersDarkMode) {
                    body.setAttribute('data-theme', 'dark');
                    if (themeSwitch) {
                        themeSwitch.checked = true;
                    }
                }
            }
            
            // Theme switch event listener
            if (themeSwitch) {
                themeSwitch.addEventListener('change', function() {
                    if (this.checked) {
                        body.setAttribute('data-theme', 'dark');
                        localStorage.setItem('theme', 'dark');
                    } else {
                        body.setAttribute('data-theme', 'light');
                        localStorage.setItem('theme', 'light');
                    }
                });
            }

            // Mobile menu toggle
            const menuToggle = document.querySelector('.menu-toggle');
            const nav = document.querySelector('.nav');
            
            if (menuToggle && nav) {
                menuToggle.addEventListener('click', function() {
                    nav.classList.toggle('active');
                });
            }

            // Password visibility toggle
            const passwordToggle = document.querySelector('.password-toggle');
            const passwordInput = document.getElementById('password');
            
            if (passwordToggle && passwordInput) {
                passwordToggle.addEventListener('click', function() {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    const icon = this.querySelector('i');
                    if (icon) {
                        icon.classList.toggle('fa-eye');
                        icon.classList.toggle('fa-eye-slash');
                    }
                });
            }

            // Signup form submission
            const signupForm = document.getElementById('signup-form');
            const signupError = document.getElementById('signup-error');
            
            signupForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                signupError.textContent = '';
                
                const username = document.getElementById('username').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirm-password').value;
                
                // Validate password match and length
                if (password !== confirmPassword) {
                    signupError.textContent = 'Passwords do not match';
                    return;
                }
                
                // Validate password length (minimum 6 characters)
                if (password.length < 6) {
                    signupError.textContent = 'Please enter a password with 6 or more characters';
                    return;
                }
                
                try {
                    // Only send the fields that the backend expects
                    const response = await AuthService.register({ 
                        username, 
                        email, 
                        password,
                        // Include empty preferences object to match the User model
                        preferences: {
                            travelStyle: [],
                            foodPreferences: []
                        }
                    });
                    
                    // Handle successful registration
                    login(response.token, response.user);
                    window.location.href = 'onboarding.html';
                } catch (error) {
                    console.error('Registration error:', error);
                    signupError.textContent = error.message || 'Registration failed. Please try again.';
                }
            });
        });
    </script>
</body>
</html>
